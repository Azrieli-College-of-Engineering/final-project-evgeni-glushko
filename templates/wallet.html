{% extends "layout.html" %}
{% block content %}
<h1>👛 Wallet</h1>
<p><b>Balance:</b> {{ balance }} P-coins</p>

<form method="post" action="{{ url_for('wallet_topup') }}">
  <label>Top up amount:
    <input name="amount" type="number" min="1" max="1000" value="50" />
  </label>
  <button class="btn btn-primary" type="submit">Top up</button>
</form>
{% endblock %}
